<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <title id="t">Ablauf zwischen Arztpraxis und Labor mit LDT 3</title>
  <desc id="d">Die Praxis schickt einen Laborauftrag als LDT-Datei mit den Satzarten 8230, 8215 und 8231 an das Labor. Das Labor schickt den Befund als LDT-Datei mit den Satzarten 8220, 8205 und 8221 an die Praxis zurück.</desc>
  <rect width="960" height="420" rx="18" fill="#0f1419"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
  </defs>
  <!-- Praxis -->
  <rect x="40" y="130" width="200" height="160" rx="16" fill="#1a222c" stroke="#2e3a4a" stroke-width="2"/>
  <text x="140" y="200" text-anchor="middle" fill="#e8eef4" font-size="26" font-weight="700">Arztpraxis</text>
  <text x="140" y="232" text-anchor="middle" fill="#9aa7b4" font-size="17">Praxissoftware</text>
  <!-- Labor -->
  <rect x="720" y="130" width="200" height="160" rx="16" fill="#1a222c" stroke="#2e3a4a" stroke-width="2"/>
  <text x="820" y="200" text-anchor="middle" fill="#e8eef4" font-size="26" font-weight="700">Labor</text>
  <text x="820" y="232" text-anchor="middle" fill="#9aa7b4" font-size="17">Laborsoftware</text>
  <!-- Auftrag -->
  <line x1="250" y1="160" x2="706" y2="160" stroke="#a78bfa" stroke-width="3" marker-end="url(#pfeil)"/>
  <text x="480" y="66" text-anchor="middle" fill="#c4b5fd" font-size="20" font-weight="700">Auftrag (LDT-Datei)</text>
  <g font-size="16" fill="#e8eef4" text-anchor="middle">
    <rect x="292" y="84" width="120" height="44" rx="10" fill="#241d3a" stroke="#8b5cf6"/><text x="352" y="112">8230 Kopf</text>
    <rect x="420" y="84" width="120" height="44" rx="10" fill="#241d3a" stroke="#8b5cf6"/><text x="480" y="112">8215 Auftrag</text>
    <rect x="548" y="84" width="120" height="44" rx="10" fill="#241d3a" stroke="#8b5cf6"/><text x="608" y="112">8231 Ende</text>
  </g>
  <!-- Befund -->
  <line x1="710" y1="260" x2="254" y2="260" stroke="#7dd3fc" stroke-width="3" marker-end="url(#pfeil2)"/>
  <defs><marker id="pfeil2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>
  <g font-size="16" fill="#e8eef4" text-anchor="middle">
    <rect x="292" y="292" width="120" height="44" rx="10" fill="#132433" stroke="#38bdf8"/><text x="352" y="320">8220 Kopf</text>
    <rect x="420" y="292" width="120" height="44" rx="10" fill="#132433" stroke="#38bdf8"/><text x="480" y="320">8205 Befund</text>
    <rect x="548" y="292" width="120" height="44" rx="10" fill="#132433" stroke="#38bdf8"/><text x="608" y="320">8221 Ende</text>
  </g>
  <text x="480" y="376" text-anchor="middle" fill="#7dd3fc" font-size="20" font-weight="700">Befund (LDT-Datei)</text>
  <text x="480" y="404" text-anchor="middle" fill="#9aa7b4" font-size="14">Satzarten in Feld 8000 laut KBV LDT 3.2.20, Kap. 6.2</text>
</svg>
