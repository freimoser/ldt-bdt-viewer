name: Tests und Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Build (inkl. SEO- und Linkprüfung)
        run: node scripts/build.mjs
      # Sperre vor dem Livegang: Impressum mit ladungsfähiger Anschrift, Sitemap ↔ noindex, Favicons, keine Fremdeinbindungen
      - name: Livegang-Prüfung
        if: github.event_name != 'pull_request'
        run: node scripts/check-launch.mjs
      - name: Pages-Artefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
      # Bing und andere IndexNow-Suchmaschinen über die Seiten der Sitemap informieren (auch Grundlage für KI-Suchen).
      # Schlüsseldatei: src/static/6c5fe2dd45d816f46d9434d4a2cdf329.txt. Ein Fehler hier bricht das Deployment nicht ab.
      - name: IndexNow
        continue-on-error: true
        env:
          KEY: 6c5fe2dd45d816f46d9434d4a2cdf329
          SITE: https://freimoser.github.io/ldt-bdt-viewer/
        run: |
          sleep 30
          URLS=$(curl -fsS "${SITE}sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          BODY=$(jq -nc --arg key "$KEY" --arg loc "${SITE}${KEY}.txt" --argjson urls "$URLS" '{host: "freimoser.github.io", key: $key, keyLocation: $loc, urlList: $urls}')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
