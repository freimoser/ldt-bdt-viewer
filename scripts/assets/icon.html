<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
.s{width:var(--s);height:var(--s);display:grid;place-items:center;border-radius:calc(var(--s)*0.25);
background:linear-gradient(145deg,#a78bfa 0%,#8b5cf6 45%,#6d28d9 100%);color:#fff;font:800 calc(var(--s)*0.34)/1 -apple-system,"Segoe UI",system-ui,sans-serif;letter-spacing:0.04em}
.m{border-radius:0;font-size:calc(var(--s)*0.25)}
</style></head><body><div class="s" id="i">LDT</div>
<script>const q=new URLSearchParams(location.search);document.documentElement.style.setProperty('--s',q.get('s')+'px');if(q.get('m'))document.getElementById('i').classList.add('m');if(q.get('f'))document.getElementById('i').style.fontSize=(q.get('s')*q.get('f'))+'px';</script></body></html>
