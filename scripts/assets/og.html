<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(139,92,246,.35),transparent),#0f1419;color:#e8eef4;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:34px}
.logo{width:150px;height:150px;border-radius:36px;background:linear-gradient(145deg,#a78bfa,#8b5cf6 45%,#6d28d9);display:grid;place-items:center;font-weight:800;font-size:46px;letter-spacing:.04em;color:#fff;box-shadow:0 14px 50px rgba(139,92,246,.45)}
h1{margin:0;font-size:78px;letter-spacing:-.02em;line-height:1.05}
p{margin:14px 0 0;font-size:32px;color:#b6c2cf;line-height:1.35}
.badges{display:flex;gap:16px;margin-top:54px}
.b{padding:12px 24px;border-radius:999px;border:2px solid #2e3a4a;background:#1a222c;font-size:26px;font-weight:600}
.b.v{background:rgba(139,92,246,.18);border-color:#8b5cf6;color:#c4b5fd}
</style></head><body>
<div class="row"><div class="logo">LDT</div><div><h1>LDT &amp; BDT Viewer</h1><p>Labordaten und Praxisdaten-Exporte im Browser lesen</p></div></div>
<div class="badges"><span class="b">LDT 2.x</span><span class="b">LDT 3.x</span><span class="b">BDT</span><span class="b v">100 % lokal – kein Upload</span></div>
</body></html>
